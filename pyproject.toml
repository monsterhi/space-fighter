[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-fighter"
version = "1.0.0"
description = "Space Fighters - a small arcade shooter built with tkinter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
space-fighter = "space_fighter.app:run"

[tool.setuptools.packages.find]
where = ["src"]
